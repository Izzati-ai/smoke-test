<style>

:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--crit:#f85149;--warn:#d29922;--ok:#3fb950;--acc:#58a6ff;--acc2:#a371f7;--gradeA:#ff6b6b;--gradeB:#ffa657;--gradeC:#4ecdc4;--gradeD:#74c0fc}

*{box-sizing:border-box;margin:0;padding:0;font-family:'JetBrains Mono','Fira Code',monospace}

body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.5}

.btn:hover{border-color:var(--acc);background:#1f2937}

.btn.crit{background:var(--crit);border-color:var(--crit);color:#fff}

.btn.warn{background:var(--warn);border-color:var(--warn);color:#0d1117}

.btn:disabled{opacity:.4;cursor:not-allowed}

input,select,textarea{background:#0d1117;border:1px solid var(--border);color:var(--text);padding:.5rem;border-radius:4px;font-family:inherit;font-size:.85rem;width:100%}

input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}

label{display:block;margin-bottom:.25rem;font-size:.75rem;color:var(--muted)}

.form-row{display:grid;gap:.75rem;margin-bottom:.75rem}

.form-row-2{grid-template-columns:1fr 1fr}

.log{background:#0d1117;border:1px solid var(--border);border-radius:4px;padding:.75rem;max-height:200px;overflow-y:auto;font-size:.7rem;line-height:1.6;color:var(--muted);font-family:inherit}

.log-entry{margin:.25rem 0;padding:.25rem;border-left:2px solid var(--border);padding-left:.5rem}

.log-entry.crit{border-color:var(--crit);color:var(--crit)}

.log-entry.warn{border-color:var(--warn);color:var(--warn)}

.log-entry.ok{border-color:var(--ok);color:var(--ok)}

.log-entry.info{border-color:var(--acc);color:var(--acc)}

.progress{height:6px;background:#0d1117;border-radius:3px;overflow:hidden;margin:.5rem 0}

.progress>div{height:100%;transition:width .3s}

.badge{display:inline-block;padding:.15rem .4rem;border-radius:3px;font-size:.65rem;font-weight:600;text-transform:uppercase}

.badge-crit{background:rgba(248,81,73,.2);color:var(--crit);border:1px solid var(--crit)}

.badge-warn{background:rgba(210,153,34,.2);color:var(--warn);border:1px solid var(--warn)}

.badge-ok{background:rgba(63,185,80,.2);color:var(--ok);border:1px solid var(--ok)}

.badge-info{background:rgba(88,166,255,.2);color:var(--acc);border:1px solid var(--acc)}

.table{width:100%;border-collapse:collapse;font-size:.75rem}

.table th,.table td{padding:.4rem .5rem;text-align:left;border-bottom:1px solid var(--border)}

.table th{color:var(--muted);font-weight:500;font-size:.7rem;text-transform:uppercase}

.table tr:hover{background:#1f2937}

.tabs{display:flex;gap:.25rem;margin-bottom:.75rem;border-bottom:1px solid var(--border);padding-bottom:.25rem}

.tabs button{background:none;border:none;color:var(--muted);padding:.4rem .75rem;font-size:.75rem;cursor:pointer;border-radius:4px 4px 0 0;transition:all .15s}

.tabs button:hover{color:var(--text);background:#1f2937}

.tabs button.active{color:var(--acc);border-bottom:2px solid var(--acc)}

.tab-content{display:none}

.tab-content.active{display:block}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s}

.modal.open{opacity:1;pointer-events:auto}

.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:1.5rem;max-width:500px;width:90%;max-height:80vh;overflow:auto}

.modal-box h2{margin-bottom:1rem;color:var(--acc)}

.timer-display{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;font-family:'JetBrains Mono',monospace;color:var(--text)}

.timer-display.warn{color:var(--warn)}

.timer-display.crit{color:var(--crit);animation:pulse 1s infinite}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.hidden{display:none!important}

.toast{position:fixed;bottom:1rem;right:1rem;background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:.75rem 1rem;z-index:2000;transform:translateY(100px);opacity:0;transition:all .3s}

.toast.show{transform:translateY(0);opacity:1}

.toast.crit{border-left:4px solid var(--crit)}

.toast.warn{border-left:4px solid var(--warn)}

.toast.ok{border-left:4px solid var(--ok)}

.toast.info{border-left:4px solid var(--acc)}

@media(max-width:768px){.header-grid{grid-template-columns:1fr;text-align:center}.stats{justify-content:center}.timer-display{font-size:2rem}}

</style>

</head>
